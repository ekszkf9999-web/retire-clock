<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>명퇴시계 검증</title>
<style>
  html,body{margin:0;background:#1b1b1b;color:#e6e6e6;font:13px/1.5 -apple-system,system-ui,sans-serif}
  #stage{position:absolute;left:0;top:0;width:390px;height:844px;background:#000}
  #frame{width:390px;height:844px;border:0;display:block;background:#0a0e13}
  #panel{position:absolute;left:400px;top:0;right:0;bottom:0;padding:10px 14px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap}
  .ok{color:#6ee7a8}.bad{color:#ff8b7a}
</style>
</head>
<body>
<div id="stage"><iframe id="frame" width="390" height="844" title="명퇴시계 390x844"></iframe></div>
<div id="panel"></div>
<script>
var frame=document.getElementById('frame'), panel=document.getElementById('panel');
window.__errs=[];
function draw(){
  var w=frame.contentWindow, d=frame.contentDocument;
  var de=d?d.documentElement:null;
  var lines=[];
  lines.push('frame '+frame.clientWidth+'x'+frame.clientHeight);
  if(de){
    var ver=d.getElementById('sVer');
    if(ver) lines.push('build: '+ver.textContent.slice(0,60));
    lines.push('doc scrollWidth '+de.scrollWidth+' / clientWidth '+de.clientWidth+'  '+(de.scrollWidth>de.clientWidth?'가로 스크롤 있음':'가로 스크롤 없음'));
    lines.push('body scrollWidth '+d.body.scrollWidth);
  }
  lines.push('errors '+window.__errs.length);
  window.__errs.forEach(function(e,i){ lines.push('  '+(i+1)+'. '+e); });
  panel.innerHTML='<div class="'+(window.__errs.length?'bad':'ok')+'">'+lines.join('\n')+'</div>';
}
function hook(){
  var w;
  try{ w=frame.contentWindow; }catch(e){ return; }
  if(!w||w.__hooked) return;
  w.__hooked=true;
  w.addEventListener('error',function(e){
    window.__errs.push('ERROR: '+(e.message||'')+' @'+(e.filename||'')+':'+(e.lineno||0)+':'+(e.colno||0)); draw();
  });
  w.addEventListener('unhandledrejection',function(e){
    window.__errs.push('REJECT: '+(e.reason&&e.reason.message?e.reason.message:e.reason)); draw();
  });
  var c=w.console;
  ['error','warn'].forEach(function(k){
    var f=c[k];
    c[k]=function(){
      var a=Array.prototype.slice.call(arguments).map(function(x){ try{ return typeof x==='string'?x:JSON.stringify(x); }catch(e2){ return String(x); } }).join(' ');
      window.__errs.push(k.toUpperCase()+': '+a); draw(); f.apply(c,arguments);
    };
  });
}
frame.addEventListener('load',function(){ hook(); setTimeout(draw,80); });
setInterval(function(){ hook(); },400);
setTimeout(draw,1200);
frame.src='./index.html?t='+Date.now();
</script>
</body>
</html>
