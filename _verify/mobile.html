<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>배포 검증용 (390×844)</title>
<style>
  html,body{margin:0;padding:0;background:#2b2f36}
  #wrap{position:absolute;top:0;left:0;width:390px;height:844px;overflow:hidden;background:#000}
  #f{width:390px;height:844px;border:0;display:block}
  #log{position:absolute;top:0;left:398px;width:560px;color:#7dffb2;font:11px/1.5 monospace;white-space:pre-wrap;margin:0;padding:8px}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" title="명퇴시계 390x844"></iframe></div>
<pre id="log">검증 준비…</pre>
<script>
(function(){
  var f=document.getElementById('f');
  var log=document.getElementById('log');
  window.__check={stage:'start', metrics:null, rerun:null};

  function metrics(){
    var w=f.contentWindow, d=f.contentDocument;
    var nav=d.querySelector('.nav'); var nr=nav&&nav.getBoundingClientRect();
    var perf=w.performance;
    var navEntry=perf.getEntriesByType('navigation')[0]||{};
    return {
      vw:w.innerWidth, vh:w.innerHeight, dpr:w.devicePixelRatio,
      title:d.title,
      docClientW:d.documentElement.clientWidth, docScrollW:d.documentElement.scrollWidth,
      bodyScrollW:d.body.scrollWidth,
      hDate:(d.querySelector('#hDate')||{}).textContent,
      hAge:(d.querySelector('#hAge')||{}).textContent,
      hero:(d.querySelector('#hero')||{textContent:''}).textContent.replace(/\s+/g,' ').trim().slice(0,90),
      statsCells:d.querySelectorAll('#hStats > *').length,
      navBar:nr&&{top:Math.round(nr.top),bottom:Math.round(nr.bottom),width:Math.round(nr.width)},
      viewOn:(d.querySelector('.view.on')||{}).id,
      navStatus:navEntry.responseStatus, navTransfer:navEntry.transferSize,
      swControlled:!!w.navigator.serviceWorker.controller,
      manifest:(d.querySelector('link[rel=manifest]')||{}).href,
      icons:Array.prototype.map.call(d.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]'),function(l){return l.getAttribute('href')+' '+l.getAttribute('sizes');}),
      themeMeta:(d.querySelector('meta[name=theme-color]')||{}).content
    };
  }

  f.addEventListener('load', function(){
    // 실제 폰처럼 스크롤바가 자리를 차지하지 않게 (390px 그대로 보이도록)
    try { f.contentDocument.documentElement.style.scrollbarWidth='none'; } catch(e) {}
    window.__check.metrics=metrics();
    window.__check.stage='first-load';
    // 앱 인라인 스크립트를 같은 iframe에서 한 번 더 실행하며 에러를 잡습니다
    fetch('../?build=ce50cec', {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(html){
      var m=html.match(/<script>([\s\S]*?)<\/script>/);
      if(!m){ window.__check.rerun={error:'script not found'}; return; }
      var w=f.contentWindow;
      var errs=[];
      w.onerror=function(msg,src,line,col,err){ errs.push('onerror: '+msg+' @'+line+':'+col); return false; };
      w.addEventListener('unhandledrejection', function(e){ errs.push('unhandledrejection: '+String(e.reason)); });
      var ce=w.console.error, cw=w.console.warn;
      w.console.error=function(){ errs.push('console.error: '+Array.prototype.slice.call(arguments).join(' ')); return ce.apply(w.console,arguments); };
      w.console.warn=function(){ errs.push('console.warn: '+Array.prototype.slice.call(arguments).join(' ')); return cw.apply(w.console,arguments); };
      var ok=true, thrown=null;
      try { w.eval(m[1]); } catch(e){ ok=false; thrown=String(e&&e.message||e); }
      window.__check.rerun={ok:ok, thrown:thrown, errors:errs, after:metrics()};
      window.__check.stage='done';
    }).catch(function(e){
      window.__check.rerun={error:String(e)};
      window.__check.stage='done';
    });
  });

  function paint(){
    var c=window.__check;
    var lines=['stage: '+c.stage];
    if(c.metrics){
      Object.keys(c.metrics).forEach(function(k){
        var v=c.metrics[k];
        lines.push('  '+k+': '+(typeof v==='object'?JSON.stringify(v):v));
      });
    }
    if(c.rerun){
      lines.push('rerun: ok='+c.rerun.ok+' thrown='+c.rerun.thrown+' errors='+JSON.stringify(c.rerun.errors||c.rerun));
      if(c.rerun.after){
        lines.push('after-rerun hero: '+c.rerun.after.hero);
        lines.push('after-rerun statsCells: '+c.rerun.after.statsCells+' navBar: '+JSON.stringify(c.rerun.after.navBar));
      }
    }
    log.textContent=lines.join('\n');
  }
  setInterval(paint, 700);
  f.src='../?build=ce50cec';
})();
</script>
</body>
</html>
